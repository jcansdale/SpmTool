name: Send Test Email

env:
  SMTP_SERVER: smtp.gmail.com
  SMTP_USERNAME: spm@mutantdesign.co.uk
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_FROM: spm@mutantdesign.co.uk
  EMAIL_TO: jcansdale+spm@gmail.com

on:
  push:
  workflow_dispatch:

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        run: |
          (
            echo "Subject: GitHub Actions Test Email"
            echo "To: ${{ env.EMAIL_TO }}"
            echo "From: ${{ env.EMAIL_FROM }}"
            echo
            echo "This is a test email sent from a GitHub Actions workflow."
            echo "If you received this, the workflow is working!"
          ) | curl --url "smtp://${{ env.SMTP_SERVER }}:587" \
              --ssl-reqd \
              --mail-from "${{ env.EMAIL_FROM }}" \
              --mail-rcpt "${{ env.EMAIL_TO }}" \
              --user "${{ env.SMTP_USERNAME }}:${{ env.SMTP_PASSWORD }}" \
              --insecure --upload-file -
